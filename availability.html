<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Availability')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: sidebar('student', 'availability')}"></aside>

    <div class="main">
        <header th:replace="~{fragments/layout :: topbar('student')}"></header>

        <main class="content">
            <p class="alert-success" th:if="${success}" th:text="${success}">Saved.</p>

            <form class="card" th:action="@{/availability}" method="post">
                <h1 style="margin-bottom: 4px;">My Availability for Oral Presentations</h1>
                <p class="muted">Select the times you are available (you can select multiple slots).</p>

                <div class="table-wrap">
                    <table class="table availability-table">
                        <thead>
                        <tr>
                            <th></th>
                            <th th:each="day : ${days}"
                                th:text="${#strings.capitalize(#strings.toLowerCase(#strings.substring(day.name(), 0, 3)))}">Mon</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="hour : ${hours}">
                            <td th:text="${#numbers.formatInteger(hour, 2) + ':00 – ' + #numbers.formatInteger(hour + 1, 2) + ':00'}">09:00 – 10:00</td>
                            <td th:each="day : ${days}">
                                <input type="checkbox"
                                       name="slots"
                                       th:value="${day.name() + '_' + hour}"
                                       th:checked="${selectedSlots.contains(day.name() + '_' + hour)}"
                                       th:attr="aria-label=${day.name() + ' ' + hour + ':00'}"/>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div class="actions">
                    <button type="submit" class="button">Save Availability</button>
                </div>
            </form>
        </main>
    </div>
</div>
</body>
</html>
