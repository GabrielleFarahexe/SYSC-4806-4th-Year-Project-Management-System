<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Add Project</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<nav class="topnav">
    <strong>4th Year Projects</strong>
    <a th:href="@{/professor}">Dashboard</a>
    <a th:href="@{/professor/projects/new}" class="active">Add Project</a>
</nav>

<main class="container">
    <h1>Add Project</h1>

    <form class="card form" th:action="@{/professor/projects}" th:object="${project}" method="post">

        <div class="field">
            <label for="title">Title</label>
            <input type="text" th:field="*{title}" maxlength="150"
                   th:classappend="${#fields.hasErrors('title')} ? 'invalid'"/>
            <p class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Error</p>
        </div>

        <div class="field">
            <label for="description">Description</label>
            <textarea th:field="*{description}" rows="6" maxlength="2000"
                      th:classappend="${#fields.hasErrors('description')} ? 'invalid'"></textarea>
            <p class="error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Error</p>
        </div>

        <div class="field">
            <label for="programRestrictions">Program Restrictions</label>
            <select th:field="*{programRestrictions}" multiple size="5">
                <option th:each="program : ${programs}"
                        th:value="${program}"
                        th:text="${program.displayName}">Program</option>
            </select>
            <p class="hint">Hold Ctrl (Cmd on Mac) to select several. Leave empty to allow all programs.</p>
        </div>

        <div class="field">
            <label for="requiredStudents">Required Students</label>
            <input type="number" th:field="*{requiredStudents}" min="1" max="10"
                   th:classappend="${#fields.hasErrors('requiredStudents')} ? 'invalid'"/>
            <p class="error" th:if="${#fields.hasErrors('requiredStudents')}" th:errors="*{requiredStudents}">Error</p>
        </div>

        <div class="actions">
            <button type="submit" class="button">Create Project</button>
            <a th:href="@{/professor}">Cancel</a>
        </div>
    </form>
</main>
</body>
</html>
