<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | 4th Year Project Management System</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #eef3fb;
            color: #1f2430;
        }

        .card {
            width: 100%;
            max-width: 360px;
            background: #fff;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 8px 30px rgba(15, 35, 70, 0.08);
            text-align: center;
        }

        .logo {
            color: #1e3a5f;
            margin-bottom: 0.5rem;
        }

        h1 {
            font-size: 1.3rem;
            margin: 0 0 0.25rem;
        }

        .muted {
            color: #6b7280;
            margin: 0 0 1.5rem;
            font-size: 0.95rem;
        }

        label {
            display: block;
            text-align: left;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 0.3rem;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 0.65rem 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font: inherit;
            margin-bottom: 1rem;
        }

        input:focus {
            outline: 2px solid #1d6fd8;
            border-color: #1d6fd8;
        }

        button {
            width: 100%;
            padding: 0.7rem;
            border: none;
            border-radius: 8px;
            background: #1d6fd8;
            color: #fff;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #1658ad;
        }

        .alert {
            padding: 0.6rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .error {
            background: #fde8e8;
            color: #b42318;
        }

        .success {
            background: #e7f6ec;
            color: #1e6b3a;
        }

        .back {
            display: inline-block;
            margin-top: 1rem;
            color: #1d6fd8;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="logo">
            <svg width="44" height="44" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 3 1 9l11 6 9-4.9V17h2V9L12 3zm-6 9.2V16c0 1.7 2.7 3 6 3s6-1.3 6-3v-3.8l-6 3.3-6-3.3z" />
            </svg>
        </div>
        <h1>4th Year Project<br>Management System</h1>
        <p class="muted">Sign in to continue</p>

        <div class="alert error" th:if="${param.error}">Invalid username or password.</div>
        <div class="alert success" th:if="${param.logout}">You have been signed out.</div>

        <form th:action="@{/login}" method="post">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" placeholder="student" required autofocus>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" required>

            <button type="submit">Sign In</button>
        </form>

        <a class="back" th:href="@{/about}">About this system</a>
    </div>
</body>

</html>
