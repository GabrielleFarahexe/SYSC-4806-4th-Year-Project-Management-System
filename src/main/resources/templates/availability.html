<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My Availability')}"></head>
<body>
<!-- Shared by students and professors: pick the sidebar for whoever is logged in. -->
<div class="app" th:with="role=${#authorization.expression('hasRole(''PROFESSOR'')')} ? 'professor' : 'student'">
    <aside th:replace="~{fragments/layout :: sidebar(${role}, 'availability')}"></aside>

    <div class="app-main">
        <header th:replace="~{fragments/layout :: topbar(${role == 'professor'} ? 'Professor' : 'Student')}"></header>

        <main class="content">
            <div class="page-header">
                <h1>My Availability for Oral Presentations</h1>
            </div>

            <p class="alert alert-success" th:if="${success}" th:text="${success}"></p>

            <form class="card" th:action="@{/availability}" method="post">
                <p class="muted">Select all the times you are available (you can select multiple slots).</p>

                <table class="availability-grid">
                    <thead>
                    <tr>
                        <th></th>
                        <th th:each="day : ${days}"
                            th:text="${#strings.capitalize(#strings.toLowerCase(day.name()))}">Monday</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="hour : ${hours}">
                        <td th:text="${hour + ':00 - ' + (hour + 1) + ':00'}">9:00 - 10:00</td>
                        <td th:each="day : ${days}">
                            <label class="slot">
                                <input type="checkbox" name="slots"
                                       th:value="${day.name() + '_' + hour}"
                                       th:checked="${selectedSlots.contains(day.name() + '_' + hour)}"
                                       th:attr="aria-label=${day.name() + ' ' + hour + ':00'}">
                                <span>✓</span>
                            </label>
                        </td>
                    </tr>
                    </tbody>
                </table>

                <div class="form-actions">
                    <button type="submit" class="button">Save Availability</button>
                </div>
            </form>
        </main>
    </div>
</div>
</body>
</html>
