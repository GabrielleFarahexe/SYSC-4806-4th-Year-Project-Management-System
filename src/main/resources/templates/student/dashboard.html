<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Student Dashboard')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: sidebar('student', 'dashboard')}"></aside>

    <div class="app-main">
        <header th:replace="~{fragments/layout :: topbar('Student')}"></header>

        <main class="content">
            <div class="page-header">
                <h1>Welcome, <span sec:authentication="name">Student</span></h1>
            </div>

            <section class="stats">
                <div class="stat-card">
                    <div class="stat-value" th:text="${totalProjects}">0</div>
                    <div class="stat-label">Projects offered</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" th:text="${totalPrograms}">0</div>
                    <div class="stat-label">Programs</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" th:text="${totalSpots}">0</div>
                    <div class="stat-label">Student spots</div>
                </div>
            </section>

            <section class="card empty-state">
                <h2>No Project Yet</h2>
                <p class="muted">You have not been assigned to a project.<br>Browse available projects and apply!</p>
                <a class="button" th:href="@{/student/projects}">Browse Projects</a>
            </section>

            <section class="card">
                <div class="card-header">
                    <h2>Featured Projects</h2>
                    <a th:href="@{/student/projects}">View all</a>
                </div>

                <p class="muted" th:if="${#lists.isEmpty(featuredProjects)}">No project topics yet.</p>

                <ul class="activity" th:unless="${#lists.isEmpty(featuredProjects)}">
                    <li th:each="project : ${featuredProjects}">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                        <div class="grow">
                            <strong th:text="${project.title}">Title</strong>
                            <div class="tags">
                                <span class="tag" th:if="${project.openToAllPrograms}">All programs</span>
                                <span class="tag" th:each="prog : ${project.programRestrictions}"
                                      th:text="${prog.displayName}">Program</span>
                            </div>
                        </div>
                        <span class="badge" th:text="'Team of ' + ${project.requiredStudents}">Team of 4</span>
                    </li>
                </ul>
            </section>
        </main>
    </div>
</div>
</body>
</html>
