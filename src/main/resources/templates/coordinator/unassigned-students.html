<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students without a Project</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #eef2f7;
            color: #1e293b;
        }
        .layout {
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 220px;
            background: #1E3A5FFF;
            color: #e2e8f0;
            padding: 20px 0;
            flex-shrink: 0;
        }
        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.05rem;
            padding: 0 20px 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            margin-bottom: 12px;
            color: #ffffff;
        }
        .sidebar a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            color: #cbd5e1;
            text-decoration: none;
            font-size: 0.95rem;
        }
        .sidebar a:hover, .sidebar a.active {
            background: rgba(255, 255, 255, 0.14);
            color: #ffffff;
        }
        .icon {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .topbar {
            height: 56px;
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            padding: 0 32px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }
        .topbar-right {
            display: flex;
            align-items: center;
            gap: 18px;
        }
        .user-profile {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: #0f172a;
        }
        .user-avatar {
            width: 28px;
            height: 28px;
            border-radius: 999px;
            background: #122c49;
            color: #ffffff;
            font-size: 0.82rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .user-role {
            color: #64748b;
        }
        .logout-form {
            margin: 0;
        }
        .logout-btn {
            background: none;
            border: none;
            padding: 0;
            font-family: inherit;
            font-size: 0.9rem;
            color: #334155;
            cursor: pointer;
        }
        .logout-btn:hover {
            color: #0f172a;
            text-decoration: underline;
        }
        .content {
            padding: 28px 36px;
        }
        .card {
            background: #ffffff;
            border-radius: 12px;
            padding: 24px 28px;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .card h1 {
            margin: 0;
            font-size: 1.45rem;
            color: #0f172a;
        }
        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #ffffff;
            color: #1e293b;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.875rem;
            padding: 7px 14px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
        }
        .btn-back:hover {
            background: #f8fafc;
        }
        .alert-banner {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1e40af;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 0.92rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
            font-size: 0.95rem;
        }
        th {
            background: #f1f5f9;
            color: #334155;
            font-weight: 600;
        }
        tbody tr:last-child td {
            border-bottom: none;
        }
        .btn-reminder {
            background: #e8f0fe;
            color: #1a56db;
            border: 1px solid #c3ddfd;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
        }
        .btn-reminder:hover {
            background: #dbeafe;
        }
        .empty-state {
            text-align: center;
            color: #64748b;
            padding: 24px;
        }
        @media (max-width: 800px) {
            .layout { flex-direction: column; }
            .sidebar { width: 100%; }
            .content { padding: 20px; }
            .card-header { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <div class="sidebar-brand">
            <svg class="icon" viewBox="0 0 24 24">
                <line x1="3" y1="6" x2="21" y2="6"/>
                <line x1="3" y1="12" x2="21" y2="12"/>
                <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
            <span>4th Year Project</span>
        </div>
        <a th:href="@{/coordinator/dashboard}">
            <svg class="icon" viewBox="0 0 24 24">
                <path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>
            </svg>
            <span>Dashboard</span>
        </a>
        <a th:href="@{/student/projects}">
            <svg class="icon" viewBox="0 0 24 24">
                <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            </svg>
            <span>Projects</span>
        </a>
        <a th:href="@{/coordinator/students/unassigned}" class="active">
            <svg class="icon" viewBox="0 0 24 24">
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
            <span>Students</span>
        </a>
        <a th:href="@{/availability}">
            <svg class="icon" viewBox="0 0 24 24">
                <rect x="3" y="4" width="18" height="18" rx="2"/>
                <line x1="16" y1="2" x2="16" y2="6"/>
                <line x1="8" y1="2" x2="8" y2="6"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
            <span>Presentations</span>
        </a>
    </aside>

    <div class="main-wrapper">
        <header class="topbar">
            <div class="topbar-right">
                <div class="user-profile">
                    <span class="user-avatar"
                          th:text="${username != null and !#strings.isEmpty(username)} ? ${#strings.toUpperCase(#strings.substring(username, 0, 1))} : 'C'">C</span>
                    <strong th:text="${username ?: 'coordinator'}">coordinator</strong>
                    <span class="user-role">(Coordinator)</span>
                </div>
                <form th:action="@{/logout}" method="post" class="logout-form">
                    <button type="submit" class="logout-btn">Log out</button>
                </form>
            </div>
        </header>

        <main class="content">
            <section class="card">
                <div class="card-header">
                    <h1>Students without a Project</h1>
                    <a th:href="@{/coordinator/dashboard}" class="btn-back">
                        <svg class="icon" viewBox="0 0 24 24">
                            <line x1="19" y1="12" x2="5" y2="12"/>
                            <polyline points="12 19 5 12 12 5"/>
                        </svg>
                        <span>Back to Dashboard</span>
                    </a>
                </div>

                <div th:if="${reminderMessage}" class="alert-banner" th:text="${reminderMessage}"></div>

                <table>
                    <thead>
                    <tr>
                        <th>Student Name</th>
                        <th>Program</th>
                        <th>Year</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="student : ${unassignedStudents}">
                        <td th:text="${student.name}">Student Name</td>
                        <td th:text="${student.program ?: 'Software Eng.'}">Software Eng.</td>
                        <td>4</td>
                        <td>
                            <form th:action="@{/students/{id}/remind(id=${student.id})}" method="post" style="margin:0;">
                                <button type="submit" class="btn-reminder">Send Reminder</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(unassignedStudents)}">
                        <td colspan="4" class="empty-state">All students currently have a project assigned.</td>
                    </tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>
</div>
</body>
</html>
