<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Browse Projects')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: sidebar('student', 'projects')}"></aside>

    <div class="app-main">
        <header th:replace="~{fragments/layout :: topbar('Student')}"></header>

        <main class="content">
            <div class="page-header">
                <h1>Available Projects</h1>
            </div>

            <form class="card filters" method="get" th:action="@{/student/projects}">
                <input type="search" name="keyword" th:value="${keyword}" placeholder="Search by keyword...">
                <select name="program">
                    <option value="">All programs</option>
                    <option th:each="prog : ${programs}" th:value="${prog.name()}" th:text="${prog.displayName}"
                            th:selected="${prog.name() == selectedProgram}">Program</option>
                </select>
                <button type="submit" class="button">Search</button>
                <a class="button secondary" th:href="@{/student/projects}">Clear</a>
            </form>

            <p class="muted" th:if="${#lists.isEmpty(projects)}">No project topics found.</p>

            <div class="project-list">
                <div class="card project-item" th:each="project : ${projects}">
                    <div>
                        <h3 th:text="${project.title}">Title</h3>
                        <p th:text="${project.description}">Description</p>
                        <div class="tags">
                            <span class="tag" th:if="${project.openToAllPrograms}">All programs</span>
                            <span class="tag" th:each="prog : ${project.programRestrictions}"
                                  th:text="${prog.displayName}">Program</span>
                        </div>
                    </div>
                    <div>
                        <span class="badge" th:text="'Team of ' + ${project.requiredStudents}">Team of 4</span>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
