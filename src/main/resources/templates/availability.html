<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My Availability')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: sidebar(${role}, 'availability')}"></aside>

    <div class="app-main">
        <header th:replace="~{fragments/layout :: topbar(${role == 'professor'} ? 'Professor' : 'Student')}"></header>

        <main class="content">
            <div class="page-header">
                <h1>My Availability for Oral Presentations</h1>
            </div>

            <p class="alert alert-success" th:if="${success}" th:text="${success}"></p>

            <form th:if="${role == 'professor' and !projects.isEmpty()}" th:action="@{${availabilityPath}}" method="get">
                <label for="project">Project</label>
                <select id="project" name="projectId" onchange="this.form.requestSubmit()">
                    <option th:each="project : ${projects}" th:value="${project.id}" th:text="${project.title}"
                            th:selected="${project.id == projectId}"></option>
                </select>
                <noscript><button type="submit" class="button">View project</button></noscript>
            </form>
            <p th:if="${role == 'professor' and projectId == null}">Create a project to set its availability.</p>
            <form th:if="${role == 'student' or projectId != null}" class="card" th:action="@{${availabilityPath}}" method="post">
                <input th:if="${projectId != null}" type="hidden" name="projectId" th:value="${projectId}">
                <p class="muted" th:if="${role == 'student'}" th:text="${allowedSlots.isEmpty()} ? 'No professor slots are available for your project.' : 'Select from your professor’s available times. Your selection is shared with every student on your project.'"></p>
                <p class="muted" th:if="${role == 'professor'}">Select all the times you are available (you can select multiple slots).</p>

                <table th:replace="~{fragments/availability-grid :: grid}"></table>

                <div class="form-actions">
                    <button th:disabled="${allowedSlots != null and allowedSlots.isEmpty()}" type="submit" class="button">Save Availability</button>
                </div>
            </form>
        </main>
    </div>
</div>
</body>
</html>
