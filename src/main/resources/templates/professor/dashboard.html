<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Professor Dashboard')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: sidebar('professor', 'dashboard')}"></aside>

    <div class="app-main">
        <header th:replace="~{fragments/layout :: topbar('Professor')}"></header>

        <main class="content">
            <div class="page-header">
                <h1>Welcome, <span sec:authentication="name">Professor</span></h1>
                <a th:href="@{/professor/projects/new}" class="button">+ Add Project</a>
            </div>

            <p class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}">Saved.</p>

            <section class="stats">
                <div class="stat-card">
                    <div class="stat-value" th:text="${totalProjects}">0</div>
                    <div class="stat-label">My Projects</div>
                    <span class="stat-sub" th:text="${activeProjects} + ' active'">0 active</span>
                </div>
                <div class="stat-card">
                    <div class="stat-value" th:text="${totalApplications}">0</div>
                    <div class="stat-label">Total Applications</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" th:text="${upcomingPresentations}">0</div>
                    <div class="stat-label">Upcoming Presentations</div>
                </div>
            </section>

            <section class="card">
                <div class="card-header">
                    <h2>Recent Activity</h2>
                </div>

                <p th:if="${#lists.isEmpty(recentProjects)}" class="muted">
                    No activity yet. Add your first project to get started.
                </p>

                <ul class="activity" th:unless="${#lists.isEmpty(recentProjects)}">
                    <li th:each="p : ${recentProjects}">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                        <span class="grow">Created project <strong th:text="${p.title}">Title</strong>
                            (<span th:text="${p.requiredStudents}">2</span> students,
                            <span th:text="${p.openToAllPrograms} ? 'all programs'
                                  : ${#strings.listJoin(p.programRestrictions.![displayName], ', ')}">all programs</span>)
                        </span>
                        <span class="time" th:text="${#temporals.format(p.createdAt, 'MMM d, HH:mm')}">Nov 11, 14:00</span>
                    </li>
                </ul>
            </section>
        </main>
    </div>
</div>
</body>
</html>
