spring.application.name=4th-Year-Project-Management-System-Group-20

# Persist development data across restarts and allow IntelliJ to connect to the same database.
spring.datasource.url=jdbc:h2:file:./data/projectdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 console
spring.h2.console.enabled=true

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
