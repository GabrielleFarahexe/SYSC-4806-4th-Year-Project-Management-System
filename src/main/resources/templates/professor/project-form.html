<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Add Project')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: sidebar('professor', 'projects')}"></aside>

    <div class="main">
        <header th:replace="~{fragments/layout :: topbar('professor')}"></header>

        <main class="content">
            <form class="card" th:action="@{/professor/projects}" th:object="${project}" method="post">
                <h1>Add New Project</h1>

                <div class="field">
                    <label for="title">Project Title</label>
                    <input type="text" th:field="*{title}" maxlength="150"
                           placeholder="e.g. AI in Healthcare"
                           th:classappend="${#fields.hasErrors('title')} ? 'invalid'"/>
                    <p class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Error</p>
                </div>

                <div class="field">
                    <label for="description">Description</label>
                    <textarea th:field="*{description}" rows="5" maxlength="2000"
                              placeholder="Enter a detailed description of the project..."
                              th:classappend="${#fields.hasErrors('description')} ? 'invalid'"></textarea>
                    <p class="error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Error</p>
                </div>

                <div class="field-row">
                    <div class="field">
                        <label for="programRestrictions">Program Restrictions</label>
                        <select th:field="*{programRestrictions}" multiple size="4">
                            <option th:each="program : ${programs}"
                                    th:value="${program}"
                                    th:text="${program.displayName}">Program</option>
                        </select>
                        <p class="hint">Leave empty for any program. Hold Ctrl (Cmd on Mac) to pick several.</p>
                    </div>

                    <div class="field">
                        <label for="requiredStudents">Number of Students Required</label>
                        <input type="number" th:field="*{requiredStudents}" min="1" max="10"
                               th:classappend="${#fields.hasErrors('requiredStudents')} ? 'invalid'"/>
                        <p class="error" th:if="${#fields.hasErrors('requiredStudents')}" th:errors="*{requiredStudents}">Error</p>
                    </div>
                </div>

                <div class="actions">
                    <a th:href="@{/professor}" class="button secondary">Cancel</a>
                    <button type="submit" class="button">Save Project</button>
                </div>
            </form>
        </main>
    </div>
</div>
</body>
</html>
